<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#B08D57"/>
      <stop offset="100%" stop-color="#8C6D3B"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E1C"/>
      <stop offset="100%" stop-color="#0E100F"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Architectural Apex / Chevron -->
  <path d="M18 25 L32 14 L46 25" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- BXC Bold Monogram -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1.5" fill="url(#goldGrad)" text-anchor="middle">BXC</text>
  
  <!-- Sub-bar Baseline -->
  <line x1="22" y1="50" x2="42" y2="50" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
